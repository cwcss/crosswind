name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main
        with:
          token: ${{ secrets.PANTRY_TOKEN }}

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Cross-compile Binaries
        run: cd packages/toolkit && bun run compile:all

      - name: Package Binaries
        run: cd packages/toolkit && bun run zip:all

      # Credentials can come from either place. `.env.production` is committed
      # with its values encrypted by dotenvx, and is decrypted here with the
      # private key held as a repo secret. If that file or the key is absent,
      # this falls straight through to the plain NPM_TOKEN secret, so neither
      # setup is required and switching between them breaks nothing.
      #
      # `--overload` matters: GitHub defines an unset secret as the empty
      # string, and dotenvx leaves an already-defined variable alone unless
      # told to override it.
      # `--no-oidc` publishes with NPM_TOKEN instead of trusted publishing.
      #
      # The trusted publisher for @stacksjs/ts-css is bound to the repository
      # that used to hold this name, not to the name itself, so every OIDC
      # attempt from here answers 401 — and pantry reports success anyway,
      # which is how v0.2.20, v0.2.21, v0.3.0, v0.3.2 and v0.3.4 all went out
      # green having published nothing. Until the publisher is re-pointed at
      # this repository on npm, the token is the path that actually works.
      #
      # Once it is re-pointed, drop the flag: OIDC needs no long-lived secret
      # and restores Sigstore provenance, which token publishing does not get.
      - name: Publish to npm
        run: |
          if [ -f .env.production ] && [ -n "$DOTENV_PRIVATE_KEY_PRODUCTION" ]; then
            echo "Using credentials from .env.production"
            bunx --bun @dotenvx/dotenvx run -f .env.production --overload -- \
              pantry publish --npm --access public --no-oidc
          else
            echo "Using credentials from repository secrets"
            pantry publish --npm --access public --no-oidc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}

      - name: Create GitHub Release
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          release: 'true'
          release-files: |
            packages/toolkit/bin/cssx-linux-x64.zip
            packages/toolkit/bin/cssx-linux-arm64.zip
            packages/toolkit/bin/cssx-windows-x64.zip
            packages/toolkit/bin/cssx-darwin-x64.zip
            packages/toolkit/bin/cssx-darwin-arm64.zip
          release-changelog: CHANGELOG.md
          release-token: ${{ secrets.GITHUB_TOKEN }}
